name: build-jetweb

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "review/**"
    tags:
      - "v*"
      - "jetweb-v*"
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-jetweb.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Inject git commit into Info.plist
        run: |
          COMMIT="$(git rev-parse --short=7 HEAD)"
          echo "JW_COMMIT=$COMMIT" >> $GITHUB_ENV
          plutil -replace JWGitCommit -string "$COMMIT" src/app/Info.plist || plutil -insert JWGitCommit -string "$COMMIT" src/app/Info.plist

      - name: Build jetwebctl root helper
        working-directory: src
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -O2 -Wall \
            -miphoneos-version-min=15.0 \
            jetwebctl.c -o jetwebctl
          ldid -Sentitlements-helper.plist jetwebctl

      - name: Build JetWeb app (Swift UIKit + SwiftUI + C/ObjC Bridge)
        working-directory: src
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -O2 -Wall -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -DJW_COMMIT=\"${{ env.JW_COMMIT }}\" \
            -c app/JetWebBridge.m -o JetWebBridge.o
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            -import-objc-header app/JetWebBridge.h \
            JetWebBridge.o \
            app/Models.swift \
            app/Logger.swift \
            app/NotificationManager.swift \
            app/WebScripts.swift \
            app/ErrorOverlayView.swift \
            app/SettingsDrawerView.swift \
            app/HubViewController.swift \
            app/AppMain.swift \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -framework UIKit -framework SwiftUI -framework Foundation -framework WebKit -framework UserNotifications -framework AVFoundation -framework CoreGraphics -framework QuartzCore -framework Security \
            -o JetWeb
          rm -f JetWebBridge.o
          ldid -Sentitlements-app.plist JetWeb

      - name: Package JetWeb.tipa
        working-directory: src
        run: |
          rm -rf Payload JetWeb.tipa JetWeb.tipa.verification
          mkdir -p Payload/JetWeb.app
          cp app/Info.plist Payload/JetWeb.app/
          cp app/Icon-*.png Payload/JetWeb.app/
          cp JetWeb jetwebctl Payload/JetWeb.app/
          chmod 755 Payload/JetWeb.app/JetWeb Payload/JetWeb.app/jetwebctl
          zip -qr JetWeb.tipa Payload

      - name: Verify JetWeb.tipa signature and entitlements
        run: python3 scripts/verify-jetweb.py --tipa src/JetWeb.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: JetWeb
          path: |
            src/JetWeb.tipa
            src/JetWeb.tipa.verification

      - name: Check package verification status before release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          STATUS_FILE="src/JetWeb.tipa.verification"
          if [ ! -f "$STATUS_FILE" ] || ! grep -q "^STATUS: VERIFIED$" "$STATUS_FILE"; then
            echo "::error::JetWeb package verification status is not VERIFIED!"
            exit 1
          fi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/JetWeb.tipa
